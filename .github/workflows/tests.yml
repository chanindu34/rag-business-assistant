name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies (CPU-only PyTorch)
        run: pip install -r requirements-dev.txt

      # No API key, no network calls, no model downloads: the tests use fake
      # Gemini clients and a fake reranker, so they run in seconds and cost nothing.
      - name: Run unit tests
        run: pytest -q tests
