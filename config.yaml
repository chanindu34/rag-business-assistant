models:
  embedding: gemini-embedding-001
  # Answers: tried in order. Each model has its own free-tier daily quota,
  # and models that 404 on your key are skipped automatically.
  # gemini-3.6-flash is left out on purpose: it is the evaluation judge,
  # and a model should not grade its own answers.
  # Run `python3 list_models.py` to see what your key can use.
  generation: gemini-3.8-flash
  generation_fallbacks:
    - gemini-3.7-flash
    - gemini-3.5-flash
    - gemini-2.5-flash
    - gemma-4-31b-it
  # HyDE only writes a rough draft for search, so cheap models are fine.
  # It never falls back to the answer models, so it cannot eat their quota.
  # If all of these are unavailable, HyDE is skipped and the raw query is used.
  hyde: gemini-3.5-flash-lite
  hyde_fallbacks:
    - gemini-3.1-flash-lite
    - gemma-4-26b-a4b-it
  judge: gemini-3.6-flash
  reranker: BAAI/bge-reranker-base

retrieval:
  # v2: full page coverage, page metadata, parent-child chunks.
  # The old 150-chunk index is still stored as jkh_annual_report_2025_26.
  collection: jkh_annual_report_2025_26_v2
  db_path: ./chroma_db
  # Passages sent to the answer model. 8, not 6: bge-reranker-base tends to
  # rank industry-group EBITDA passages above the Group-level one, which
  # debug_retrieval.py showed at rank 8.
  top_k: 8
  use_hyde: true
  # Candidates fetched by hybrid search before reranking.
  num_candidates: 30
  # Reciprocal Rank Fusion: score = w / (rrf_k + rank). 60 is the standard constant.
  rrf_k: 60
  bm25_weight: 1.0
  vector_weight: 1.0
  # Confidence tiers on the top reranker score (0 to 1):
  #   >= high_threshold        HIGH: answer normally
  #   between the two          AMBIGUOUS: answer with a caution note
  #   <  low_threshold         LOW: decline without calling the answer model
  # The reranker's score is NOT a reliable answerability signal: an off-topic
  # question (capital of France) scored 0.31 while a real one (hotel rooms,
  # answer ranked 1st by retrieval) scored 0.29. So low_threshold only
  # filters obvious junk; the answer model makes the final call and replies
  # NOT_IN_REPORT when the passages do not contain the answer.
  high_threshold: 0.6
  low_threshold: 0.05

data:
  pdf_path: ./data/Annual Report.pdf
  page_ranges:
    - [0, 60]
    - [138, 160]

chunking:
  # Children are embedded and searched; parents go to the answer model.
  child_size: 500
  child_overlap: 50
  parent_size: 2000
  parent_overlap: 200

rate_limits:
  # Per-request timeout for Gemini calls, in seconds.
  request_timeout_seconds: 60
  embed_batch_size: 100
  embedding_cache_path: ./.cache/embeddings.sqlite
  answer_cache_path: ./.cache/answers.json
  max_retries: 5
  embed_delay_seconds: 0.1

ui:
  source_preview_chars: 300
  sample_questions:
    - How much did Group EBITDA grow in 2025/26?
    - What was the Group's recurring profit before tax this year?
    - How many hotel rooms does the Group manage in Sri Lanka and the Maldives?
    - What is the status of the City of Dreams and West Container Terminal investments?
