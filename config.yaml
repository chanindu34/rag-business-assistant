models:
  embedding: gemini-embedding-001
  # Answers: tried in order. Each model has its own free-tier daily quota,
  # and models that 404 on your key are skipped automatically.
  # gemini-3.6-flash is left out on purpose: it is the evaluation judge,
  # and a model should not grade its own answers.
  # Run `python3 list_models.py` to see what your key can use.
  generation: gemini-3.8-flash
  generation_fallbacks:
    - gemini-3.7-flash
    - gemini-3.5-flash
    - gemini-2.5-flash
    - gemma-4-31b-it
  # HyDE only writes a rough draft for search, so cheap models are fine.
  # It never falls back to the answer models, so it cannot eat their quota.
  # If all of these are unavailable, HyDE is skipped and the raw query is used.
  hyde: gemini-3.5-flash-lite
  hyde_fallbacks:
    - gemini-3.1-flash-lite
    - gemma-4-26b-a4b-it
  judge: gemini-3.6-flash
  reranker: BAAI/bge-reranker-base

retrieval:
  collection: jkh_annual_report_2025_26
  db_path: ./chroma_db
  top_k: 6
  use_hyde: true

data:
  pdf_path: ./data/Annual Report.pdf
  page_ranges:
    - [0, 60]
    - [138, 160]

chunking:
  size: 500
  overlap: 50

rate_limits:
  answer_cache_path: ./.cache/answers.json
  max_retries: 5
  embed_delay_seconds: 0.1

ui:
  source_preview_chars: 300
  sample_questions:
    - How much did Group EBITDA grow in 2025/26?
    - What was the Group's recurring profit before tax this year?
    - How many hotel rooms does the Group manage in Sri Lanka and the Maldives?
    - What is the status of the City of Dreams and West Container Terminal investments?
